name: Get secrets
on: [workflow_dispatch]

jobs:
  connect-to-vault:
    runs-on: ubuntu-latest
    outputs:
      ec2_host: ${{ steps.vault-step.outputs.EC2_HOST }}
      ec2_user: ${{ steps.vault-step.outputs.EC2_USER }}
      private_key: ${{ steps.vault-step.outputs.PRIVATE_KEY }}
      signed_cert: ${{ steps.vault-step.outputs.SIGNED_CERT }}
    steps:
      - name: Get secrets and generate SSH cert
        id: vault-step
        run: |
          export VAULT_ADDR=${{ secrets.VAULT_URL }}
          export VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}

          ssh-keygen -t ed25519 -f /tmp/pipeline_key -N ""

          vault write -field=signed_key ssh/sign/ssh-ubuntu-user \
            public_key=@/tmp/pipeline_key.pub \
            valid_principals="ubuntu" \
            > /tmp/pipeline_key-cert.pub

          EC2_HOST=$(vault kv get -field=EC2_HOST aws/EC2_HOST)
          EC2_USER=$(vault kv get -field=EC2_USER aws/EC2_USER)

          # Encoder en base64 pour passer entre jobs
          PRIVATE_KEY=$(base64 -w 0 /tmp/pipeline_key)
          SIGNED_CERT=$(base64 -w 0 /tmp/pipeline_key-cert.pub)

          echo "EC2_HOST=$EC2_HOST" >> $GITHUB_OUTPUT
          echo "EC2_USER=$EC2_USER" >> $GITHUB_OUTPUT
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "SIGNED_CERT=$SIGNED_CERT" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: connect-to-vault
    environment: production
    steps:
      - name: Setup SSH and deploy
        run: |
          mkdir -p ~/.ssh

          # Décoder depuis base64
          echo "${{ needs.connect-to-vault.outputs.private_key }}" | base64 -d > /tmp/pipeline_key
          echo "${{ needs.connect-to-vault.outputs.signed_cert }}" | base64 -d > /tmp/pipeline_key-cert.pub

          chmod 600 /tmp/pipeline_key
          ssh-keyscan -H ${{ needs.connect-to-vault.outputs.ec2_host }} >> ~/.ssh/known_hosts

          ssh -i /tmp/pipeline_key \
              -o CertificateFile=/tmp/pipeline_key-cert.pub \
              ${{ needs.connect-to-vault.outputs.ec2_user }}@${{ needs.connect-to-vault.outputs.ec2_host }} \
              "cd /var/www/vortex_tcg && git pull origin main"
