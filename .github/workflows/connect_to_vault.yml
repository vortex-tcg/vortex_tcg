name: Get secrets
on: [workflow_dispatch]

jobs:
  connect-to-vault:
    runs-on: self-hosted
    steps:
      - name: Get Vault secrets
        uses: hashicorp/vault-action@v2
        with:
          url: https://localhost:8200
          method: token
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            aws/data/EC2_HOST EC2_HOST | EC2_HOST ;
            aws/data/EC2_USER EC2_USER | EC2_USER ;
