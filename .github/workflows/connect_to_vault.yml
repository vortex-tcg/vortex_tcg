name: Get secrets
on: [workflow_dispatch]

jobs:
  connect-to-vault:
    runs-on: ubuntu-latest
    outputs:
      ec2_host: ${{ steps.vault-step.outputs.EC2_HOST }}
      ec2_user: ${{ steps.vault-step.outputs.EC2_USER }}
    steps:
      - name: try to connect EC2
        run: |
          export VAULT_ADDR=${{ secrets.VAULT_URL }}
          export VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}

          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          sudo apt-get update
          sudo apt-get install -y gpg

          wget -O- https://apt.releases.hashicorp.com/gpg | 
          gpg --dearmor | 
          sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | 
          sudo tee /etc/apt/sources.list.d/hashicorp.list

          sudo apt-get update
          sudo apt-get install -y vault

          ssh-keygen -t ed25519 -f /tmp/pipeline_key -N ""

          vault write -field=signed_key ssh/sign/ssh-ubuntu-user \
            public_key=@/tmp/pipeline_key.pub \
            valid_principals="ubuntu" \
            > /tmp/pipeline_key-cert.pub

      - name: Upload SSH keys as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssh-keys
          path: |
            /tmp/pipeline_key
            /tmp/pipeline_key-cert.pub
          retention-days: 1

      - name: Get secrets
        id: vault-step
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ secrets.VAULT_URL }}
          method: token
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            aws/EC2_HOST EC2_HOST | EC2_HOST
            aws/EC2_USER EC2_USER | EC2_USER

  build:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: connect-to-vault
    environment: production

    steps:
      - name: Download SSH keys
        uses: actions/download-artifact@v3
        with:
          name: ssh-keys
          path: /tmp/

      - name: Pull latest on EC2
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ needs.connect-to-vault.outputs.ec2_host }}
          username: ${{ needs.connect-to-vault.outputs.ec2_user }}
          key_path: /tmp/pipeline_key
          cert_path: /tmp/pipeline_key-cert.pub
          script: |
            cd /path/to/your/project
            git pull origin main
