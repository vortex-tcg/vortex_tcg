name: Get secrets
on: [workflow_dispatch]

jobs:
  connect-to-vault:
    runs-on: ubuntu-latest
    steps:
      # - name: Get secrets
      #   uses: hashicorp/vault-action@v2
      #   with:
      #     url: ${{ secrets.VAULT_URL }}
      #     method: token
      #     token: ${{ secrets.VAULT_TOKEN }}
      #     secrets: |
      #       aws/EC2_HOST EC2_HOST | EC2_HOST

      - name: try to connect EC2
        run: |
          export VAULT_ADDR=${{ secrets.VAULT_URL }}
          export VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}

          sudo apt-get update
          sudo apt-get install -y gpg

          # ajouter la clé GPG HashiCorp

          wget -O- https://apt.releases.hashicorp.com/gpg | 
          gpg --dearmor | 
          sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

          # ajouter le repo

          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | 
          sudo tee /etc/apt/sources.list.d/hashicorp.list

          # installer vault

          sudo apt-get update
          sudo apt-get install -y vault

          ssh-keygen -t ed25519 -f /tmp/pipeline_key -N ""

          vault write -field=signed_key ssh/sign/ssh-ubuntu-user \
            public_key=@/tmp/pipeline_key.pub \
            valid_principals="ubuntu" \
            > /tmp/signed_key-cert.pub

          ssh -i /tmp/pipeline_key \
            -i /tmp/signed_key-cert.pub \
            ubuntu@${{ secrets.EC2_HOST }} \
            echo "Connected to EC2 instance successfully!"
