name: Get secrets
on: [workflow_dispatch]

jobs:
  connect-to-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Get secrets
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ secrets.VAULT_URL }}
          method: token
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/test | TEST_SECRET

      - name: Use secret
        run: echo $TEST_SECRET
