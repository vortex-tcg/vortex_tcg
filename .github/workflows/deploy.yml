name: Build, Analyze and Deploy (Swarm)

on:
  push:
    branches:
      - main
      - feature/sonar-stack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2 (Swarm Mode)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Setup SSH via Vault
        run: |
          export VAULT_ADDR=${{ secrets.VAULT_URL }}
          export VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}
          export VAULT_SKIP_VERIFY=true

          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          sudo apt-get update -qq
          sudo apt-get install -y gpg

          wget -qO- https://apt.releases.hashicorp.com/gpg | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/hashicorp.list

          sudo apt-get update -qq
          sudo apt-get install -y vault=1.21.3-1

          ssh-keygen -t ed25519 -f /tmp/pipeline_key -N ""

          vault write -field=signed_key ssh/sign/ssh-ubuntu-user \
            public_key=@/tmp/pipeline_key.pub \
            valid_principals="ubuntu" \
            > /tmp/pipeline_key-cert.pub

          chmod 600 /tmp/pipeline_key

          ssh -i /tmp/pipeline_key \
            -o CertificateFile=/tmp/pipeline_key-cert.pub \
            -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} \
            echo "Connected"

      - name: Export SSH helper
        run: |
          echo 'SSH_CMD=ssh -i /tmp/pipeline_key -o CertificateFile=/tmp/pipeline_key-cert.pub -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }}' >> $GITHUB_ENV

      - name: Pull latest code on EC2
        run: |
          $SSH_CMD bash << 'EOF'
            cd /var/www/vortex_tcg
            git remote set-url origin git@github.com:vortex-tcg/vortex_tcg.git
            git fetch --all
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
          EOF

      - name: Initialize Swarm if needed
        run: |
          $SSH_CMD bash << 'EOF'
            if ! docker info | grep -q "Swarm: active"; then
              docker swarm init
            fi
          EOF

      - name: Pull new Docker images
        run: |
          $SSH_CMD bash << 'EOF'
            docker pull vortextcg/vortex_repository:api
            docker pull vortextcg/vortex_repository:game
            docker pull vortextcg/vortex_repository:auth
            docker pull vortextcg/vortex_repository:migrations
            docker logout
          EOF

      - name: Create env file on server
        run: |
          $SSH_CMD bash << 'EOF'
          cd /var/www/vortex_tcg/server
          cat > .env << 'ENVEOF'
          ASP_NETCORE_ENVIRONMENT=${{ secrets.ASP_NETCORE_ENVIRONMENT }}
          SONARQUBE_PORT=${{ secrets.SONARQUBE_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_PORT=${{ secrets.DB_PORT }}
          CONNECTION_STRING=${{ secrets.CONNECTION_STRING }}
          ENVEOF
          EOF

      - name: Prepare directories for deployment
        run: |
          $SSH_CMD bash << 'EOF'
            cd /var/www/vortex_tcg/server

            mkdir -p ../certs
            mkdir -p ../traefik/dynamic
            mkdir -p ./letsencrypt

            if [ ! -f ./letsencrypt/acme.json ]; then
              touch ./letsencrypt/acme.json
            fi
            chmod 600 ./letsencrypt/acme.json

            if grep -q "migrations:" docker-compose.prod.yaml; then
              git checkout HEAD -- docker-compose.prod.yaml
            fi

            if grep -q "migrations:" docker-compose.prod.yaml; then
              echo "migrations still present after git checkout"
              exit 1
            fi
          EOF

      - name: Run database migrations
        run: |
          $SSH_CMD bash << 'EOF'
            cd /var/www/vortex_tcg/server
            docker run --rm \
              --env-file .env \
              --name migrations-$(date +%s) \
              vortextcg/vortex_repository:migrations
          EOF

      - name: Deploy SonarQube stack (if requested)
        run: |
          $SSH_CMD bash << 'EOF'
            if docker stack ls | grep -q "^sonar\b"; then
              echo "sonar stack present — checking task states..."
              if docker stack ps sonar --no-trunc --format "{{.CurrentState}}" | grep -q "Running"; then
                echo "Stack 'sonar' already running with running tasks, nothing to do."
                exit 0
              else
                echo "Stack 'sonar' exists but has no running tasks — will (re)deploy."
              fi
            fi

            mkdir -p /var/www/vortex_tcg/sonarqube
            cat > /var/www/vortex_tcg/sonarqube/docker-compose.sonarqube.yml <<'YAML'
            version: '3.8'

            services:
              db:
                image: postgres:14
                environment:
                  POSTGRES_USER: sonar
                  POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
                  POSTGRES_DB: sonarqube
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                deploy:
                  replicas: 1
                  placement:
                    constraints:
                      - node.role == manager

              sonarqube:
                image: sonarqube:9.9-community
                environment:
                  SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
                  SONAR_JDBC_USERNAME: sonar
                  SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
                  ES_JAVA_OPTS: "-Xms512m -Xmx512m"
                ports:
                  - "9000:9000"
                volumes:
                  - sonarqube_data:/opt/sonarqube/data
                  - sonarqube_extensions:/opt/sonarqube/extensions
                  - sonarqube_logs:/opt/sonarqube/logs
                  - sonarqube_temp:/opt/sonarqube/temp
                depends_on:
                  - db
                deploy:
                  replicas: 1
                  restart_policy:
                    condition: on-failure
                  resources:
                    limits:
                      memory: 1G

            volumes:
              sonarqube_data:
              sonarqube_extensions:
              sonarqube_logs:
              sonarqube_temp:
              postgres_data:

            networks:
              vortex_traefik:
                external: true
            YAML

            # Ensure ES maps count
            sudo sysctl -w vm.max_map_count=262144 || true

            # Deploy sonar stack separately
            docker stack deploy -c /var/www/vortex_tcg/sonarqube/docker-compose.sonarqube.yml --with-registry-auth sonar || true
          EOF

      - name: Deploy stack
        run: |
          $SSH_CMD bash << 'EOF'
            cd /var/www/vortex_tcg/server

            docker stack deploy -c docker-compose.prod.yaml --with-registry-auth vortex || exit 1

            sleep 10

            docker service update --force vortex_traefik

            sleep 20

            docker container prune -f

            docker stack ls | grep -q vortex || exit 1
          EOF

      - name: Verify deployment health
        run: |
          $SSH_CMD bash << 'EOF'
            docker stack ls | grep -q vortex || {
              docker stack ps vortex --no-trunc 2>&1 || true
              exit 1
            }

            docker service ls --filter "label=com.docker.stack.namespace=vortex"

            SERVICE_COUNT=$(docker service ls --filter "label=com.docker.stack.namespace=vortex" -q | wc -l)

            [ "$SERVICE_COUNT" -eq 0 ] && {
              docker stack ps vortex --no-trunc 2>&1 || true
              exit 1
            }

            docker stack ps vortex --no-trunc

            FAILED=$(docker service ls --filter "label=com.docker.stack.namespace=vortex" \
              --format "{{.Name}} {{.Replicas}}" | grep "0/" | grep -v "sonarqube" || true)

            if [ -n "$FAILED" ]; then
              for service in $(echo "$FAILED" | awk '{print $1}'); do
                docker service logs --tail 100 $service 2>&1 || true
                docker service ps $service --no-trunc
              done
              exit 1
            fi
          EOF

      - name: Cleanup old images
        run: |
          $SSH_CMD bash << 'EOF'
            docker container prune -f
            docker image prune -f
            docker image prune -a -f --filter "until=24h"
            docker network prune -f
          EOF

      - name: Display deployment summary
        run: |
          $SSH_CMD bash << 'EOF'
            docker service ls \
              --filter "label=com.docker.stack.namespace=vortex" \
              --format "table {{.Name}}\t{{.Mode}}\t{{.Replicas}}\t{{.Image}}"
          EOF

      - name: Cleanup ephemeral SSH key
        if: always()
        run: |
          rm -f /tmp/pipeline_key /tmp/pipeline_key.pub /tmp/pipeline_key-cert.pub

  build:
    name: Build and analyze
    runs-on: windows-latest
    needs: deploy
    if: needs.deploy.result == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build and analyze
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          cd ${{ github.workspace }}\server

          Write-Host "Repertoire de travail : $((Get-Location).Path)"

          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin `
            /k:"vortex-tcg_vortex_tcg_f104a55f-7ac5-40e2-a98e-d7418f556229" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" `
            /d:sonar.scanner.skipJreProvisioning=true

          dotnet restore
          dotnet build ./server.sln

          ${{ runner.temp }}\scanner\dotnet-sonarscanner end `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
