version: "3.8"

services:
  sonarqube:
    image: sonarqube:community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: ${SONARQUBE_USER}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    secrets:
      - sonar_db_user
      - sonar_db_password
    networks:
      - sonarqube_internal
      - vortex_traefik-network
    depends_on:
      - sonarqube-db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.vortex-tcg.online`)"
        - "traefik.http.routers.sonarqube.entrypoints=websecure"
        - "traefik.http.routers.sonarqube.tls=true"
        - "traefik.http.routers.sonarqube.tls.certresolver=le"
        - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  sonarqube-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${SONARQUBE_USER}
      POSTGRES_PASSWORD: ${SONARQUBE_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    secrets:
      - sonar_db_user
      - sonar_db_password
    networks:
      - sonarqube_internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

secrets:
  sonar_db_user:
    external: true
  sonar_db_password:
    external: true

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_db:

networks:
  sonarqube_internal:
    driver: overlay
    internal: true
  vortex_traefik-network:
    external: true
