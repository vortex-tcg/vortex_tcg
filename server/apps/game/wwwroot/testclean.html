<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Vortex – Test Queue & Match</title>
    <style>
        body{font-family:sans-serif;max-width:860px;margin:24px auto;padding:0 12px}
        #log{border:1px solid #999;height:260px;overflow:auto;padding:8px;border-radius:10px;white-space:pre-wrap}
        input,button{padding:6px 10px;margin:4px}
        .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
        .muted{opacity:.7}
        .ok{color:#1b7f1b}
        .bad{color:#b3261e}
    </style>
</head>
<body>
<h1>SignalR – Queue & Match (GameHubClean)</h1>

<div class="row">
    <strong>1) Login</strong>
    <label>Email: <input id="loginEmail" value="john.doe@email.com" /></label>
    <label>Mot de passe: <input id="loginPassword" value="Password123"/></label>
    <button id="loginBtn">Login</button>
    <span id="loginStatus" class="muted"></span>
</div>

<div class="row">
    <strong>2) Connexion Game</strong>
    <button id="connectBtn" disabled>Connect</button>
    <span id="connStatus" class="muted"></span>
</div>

<hr/>

<div class="row">
    <strong>3) Matchmaking</strong>
    <label>DeckId (GUID): <input id="deckId" style="width:360px" value="40640469-62fd-4e43-96ee-e84019949f9d"/></label>
    <button id="joinQueueBtn" disabled>JoinQueue</button>
    <button id="leaveQueueBtn" disabled>LeaveQueue</button>
</div>

<p class="muted">
    Pour tester un match, ouvre <strong>2 onglets</strong> avec ce fichier et connecte-toi avec <strong>2 comptes différents</strong>,
    puis clique JoinQueue dans les deux.
</p>

<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8/dist/browser/signalr.min.js"></script>
<script>
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const loginBtn = document.getElementById("loginBtn");
    const loginStatus = document.getElementById("loginStatus");

    const connectBtn = document.getElementById("connectBtn");
    const connStatus = document.getElementById("connStatus");

    const deckIdInput = document.getElementById("deckId");
    const joinQueueBtn = document.getElementById("joinQueueBtn");
    const leaveQueueBtn = document.getElementById("leaveQueueBtn");

    const logDiv = document.getElementById("log");

    let jwtToken = "";
    let connection = null;

    function append(msg) {
        const t = new Date().toLocaleTimeString();
        logDiv.textContent += `[${t}] ${msg}\n`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function setStatus(el, text, ok=null) {
        el.textContent = text;
        el.classList.remove("ok", "bad");
        if (ok === true) el.classList.add("ok");
        if (ok === false) el.classList.add("bad");
    }

    // 1) LOGIN
    loginBtn.onclick = async () => {
        try {
            setStatus(loginStatus, "Login...", null);

            const res = await fetch("http://localhost:4000/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: loginEmail.value,
                    password: loginPassword.value
                })
            });

            const json = await res.json();
            jwtToken = json?.data?.token || "";
            if (!jwtToken) throw new Error("Token introuvable dans la réponse");

            setStatus(loginStatus, "OK (token reçu)", true);
            connectBtn.disabled = false;

            append("Login OK.");
        } catch (e) {
            console.error(e);
            setStatus(loginStatus, "Login ERROR (voir console)", false);
            append("❌ Login error: " + (e?.message || e));
        }
    };

    // 2) CONNECT HUB
    connectBtn.onclick = async () => {
        try {
            setStatus(connStatus, "Connexion au hub...", null);

            // IMPORTANT: cible le port exposé côté host (8008)
            const hubUrl = "http://localhost:8008/hubs/game";

            connection = new signalR.HubConnectionBuilder()
                .withUrl(hubUrl, {
                    accessTokenFactory: () => jwtToken
                })
                .withAutomaticReconnect()
                .build();

            connection.onreconnecting(err => append("… reconnecting " + (err?.message || "")));
            connection.onreconnected(() => append("✅ reconnected"));
            connection.onclose(() => append("⚠️ connection closed"));

            // Events côté serveur
            connection.on("Connected", (connectionId) => {
                append("✅ Connected event: " + connectionId);
                setStatus(connStatus, "Connecté (" + connectionId + ")", true);
                joinQueueBtn.disabled = false;
                leaveQueueBtn.disabled = false;
            });

            // Ton CallManager envoie matchFound
            connection.on("matchFound", (payload) => {
                append("🎮 MATCH FOUND !");
                append(JSON.stringify(payload, null, 2));
            });

            // Erreurs
            connection.on("Error", (msg) => {
                append("❌ Error: " + msg);
            });

            await connection.start();

            // Ton hub envoie Connected dans OnConnectedAsync
            append("Connexion start() OK.");
            setStatus(connStatus, "Connecté (start OK)", true);
            joinQueueBtn.disabled = false;
            leaveQueueBtn.disabled = false;

        } catch (e) {
            console.error(e);
            setStatus(connStatus, "Connexion hub ERROR (voir console)", false);
            append("❌ Hub error: " + (e?.message || e));
        }
    };

    // 3) JOIN QUEUE
    joinQueueBtn.onclick = async () => {
        try {
            const deckId = (deckIdInput.value || "").trim();
            if (!deckId) return alert("Entre un DeckId");

            append("-> invoke JoinQueue(" + deckId + ")");
            await connection.invoke("JoinQueue", deckId);
            append("JoinQueue envoyé. Attente adversaire…");
        } catch (e) {
            console.error(e);
            append("❌ JoinQueue error: " + (e?.message || e));
        }
    };

    // 4) LEAVE QUEUE
    leaveQueueBtn.onclick = async () => {
        try {
            append("-> invoke LeaveQueue()");
            await connection.invoke("LeaveQueue");
            append("LeaveQueue envoyé.");
        } catch (e) {
            console.error(e);
            append("❌ LeaveQueue error: " + (e?.message || e));
        }
    };
</script>
</body>
</html>
