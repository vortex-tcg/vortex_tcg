services:
  traefik:
    image: traefik:v2.9
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:${TRAEFIK_DASHBOARD_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  migrations:
    build:
      context: .
      dockerfile: ./apps/migrations/Dockerfile.dev
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile.dev
    env_file:
      - .env
    ports:
      - "${AUTH_PORT}:${AUTH_INTERNAL_PORT}"
    volumes:
      - .:/workspace:delegated
      - /workspace/apps/auth/obj
      - /workspace/apps/auth/bin
    working_dir: /workspace/apps/auth
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - vortex-tcg

  game:
    build:
      context: .
      dockerfile: ./apps/game/Dockerfile.dev
    env_file:
      - .env
    ports:
      - "${GAME_PORT}:${GAME_INTERNAL_PORT}"
    volumes:
      - .:/workspace:delegated
      - /workspace/apps/game/obj
      - /workspace/apps/game/bin
    working_dir: /workspace/apps/game
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - vortex-tcg

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    env_file:
      - .env
    ports:
      - "${API_PORT}:${API_INTERNAL_PORT}"
    volumes:
      - .:/workspace:delegated
      - /workspace/apps/api/obj
      - /workspace/apps/api/bin
    working_dir: /workspace/apps/api
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - vortex-tcg

  db:
    image: mariadb:latest
    restart: always
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vortex-tcg

  adminer:
    image: adminer
    restart: always
    ports:
      - "${DB_ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - vortex-tcg

  sonarqube:
    image: sonarqube:latest
    depends_on:
      - db
    env_file:
      - .env
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONARQUBE_JDBC_USERNAME: ${DB_USERNAME}
      SONARQUBE_JDBC_PASSWORD: ${DB_PASSWORD}
      SONARQUBE_JDBC_URL: jdbc:mariadb://db:3306/${DB_NAME}
    ports:
      - "${SONARQUBE_PORT}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - vortex-tcg

networks:
  vortex-tcg:
    driver: bridge

  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:${VAULT_PORTS}"
    volumes:
      - vault_data:/vault/data
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  mariadb_data:
  vault_data:
