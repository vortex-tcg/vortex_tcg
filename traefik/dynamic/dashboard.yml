http:
  routers:
    dashboard:
      rule: "Host(`traefik.vortex-tcg.online`)"
      entryPoints:
        - websecure
      service: api@internal
      middlewares:
        - auth
      tls:
        certResolver: letsencrypt

  middlewares:
    auth:
      basicAuth:
        users:
          - "${TRAEFIK_DASHBOARD_PASSWORD}"
